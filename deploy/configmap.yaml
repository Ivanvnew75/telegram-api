---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegram-api-config
  namespace: moodbot
  labels:
    app.kubernetes.io/name: telegram-api
    app.kubernetes.io/part-of: moodbot
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Адрес соседнего сервиса — переменной окружения, а не константой в коде.
  #
  # Полное DNS-имя (с .svc.cluster.local), а не короткое `users`. Короткое
  # работает за счёт search-доменов в /etc/resolv.conf, но каждый запрос
  # при этом делает несколько неудачных DNS-резолвов подряд (ndots:5).
  # На нагруженном сервисе это заметная лишняя работа для CoreDNS.
  USERS_SERVICE_URL: "http://users.moodbot.svc.cluster.local"

  # Куда уходит ответ пользователя (курс Next Level, задание 4).
  #
  # "users" — синхронный вызов сервиса users, прежнее поведение.
  # "kafka" — публикация события answers.v1, откуда его разбирают
  #           сервисы answers и analytics.
  #
  # ПЕРЕКЛЮЧЕНИЕ ЖИВЁТ ЗДЕСЬ, А НЕ В КОДЕ, СПЕЦИАЛЬНО.
  # Образ 0.2.0 умеет оба режима. Сначала он выкатывается со значением
  # "users" — то есть выкатка не меняет поведения вообще, и её можно
  # делать в любой день. Только потом отдельным действием правится
  # эта строка. Откат — правка строки обратно, без пересборки образа
  # и без rollout нового артефакта.
  ANSWER_SINK: "kafka"

  # Полное имя с .svc, а не короткое: короткое разрешается через
  # search-домены resolv.conf, и в другом namespace тот же манифест
  # молча подключился бы к чужому кластеру Kafka.
  KAFKA_BROKERS: "moodbot-kafka-kafka-bootstrap:9093"

  # Адрес веб-кабинета, который бот присылает по команде /kabinet.
  # Полный внешний URL, а не внутрикластерный: ссылку открывает
  # браузер пользователя, а не под.
  WEB_ADMIN_URL: "https://moodbot.lifeups.ru"

  # Адрес самого Telegram. Вынесен в конфиг, потому что внешний API —
  # такой же backing service (Фактор 4): в тестовом окружении сюда
  # подставляется заглушка.
  TELEGRAM_API_URL: "https://api.telegram.org"

  MOOD_QUESTION: "Как вы себя чувствуете?"

  POLL_TIMEOUT: "25s"
  HTTP_TIMEOUT: "5s"
  HTTP_RETRIES: "2"
  SHUTDOWN_TIMEOUT: "15s"
