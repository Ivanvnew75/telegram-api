---
# Тип процесса «poller»: единственный, кто опрашивает Telegram.
#
# ОБЯЗАТЕЛЬНО ОДНА РЕПЛИКА. Telegram отдаёт апдейты через getUpdates
# с курсором на своей стороне; два одновременных опросчика получают
# ошибку 409 «terminated by other getUpdates request».
#
# Это важный урок про Фактор 8: «масштабируется горизонтально» —
# свойство ТИПА ПРОЦЕССА, а не приложения целиком. Попытка выкатить
# poller в три реплики не ускорит его, а сломает.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-api-poller
  namespace: moodbot
  labels:
    app.kubernetes.io/name: telegram-api
    app.kubernetes.io/component: poller
    app.kubernetes.io/part-of: moodbot
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-api
      app.kubernetes.io/component: poller
  strategy:
    # Recreate, а не RollingUpdate.
    #
    # При RollingUpdate новый под поднимется ДО остановки старого, и
    # какое-то время оба будут звать getUpdates — гарантированный 409.
    # Recreate гасит старый, потом поднимает новый: короткий перерыв
    # в приёме сообщений вместо сломанного опроса. Для фонового
    # процесса это правильный размен.
    type: Recreate
  template:
    metadata:
      annotations:
        # Аннотации для автообнаружения Prometheus.
        #
        # Это «классический» способ без оператора: Prometheus обходит
        # все поды и скрейпит те, у кого стоит scrape=true. Плюс —
        # ничего не нужно, кроме этих трёх строк. Минус — конфигурация
        # сбора размазана по манифестам приложений, и централизованно
        # изменить её (например, интервал) нельзя.
        #
        # Альтернатива в проде — Prometheus Operator и объекты
        # ServiceMonitor/PodMonitor: сбор описывается отдельным ресурсом,
        # приложение о нём не знает.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: telegram-api
        app.kubernetes.io/component: poller
        app.kubernetes.io/part-of: moodbot
    spec:
      # Больше, чем POLL_TIMEOUT (25s): опросчик должен успеть
      # доработать висящий long-polling запрос и выйти сам.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telegram-api
          image: ghcr.io/ivanvnew75/telegram-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: telegram-api-config
          env:
            # Единственное отличие от web-процесса. Один образ,
            # разное поведение — через конфигурацию (Фактор 3).
            - name: POLLING_ENABLED
              value: "true"
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: token
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # readiness у опросчика НЕ нужна: он не в Service и трафика
          # не принимает. Проба, которая ни на что не влияет, — это
          # лишние запросы и лишний шум в событиях.
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
